name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx tsx --test "test/*.test.ts"